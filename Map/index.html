<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skattekort</title>
<style>
  :root {
    --ink: #3b2a17;
    --sea: #1f3a3d;
    --paper: #ead7a6;
    --wood: #b2824a;
    --wall: #6b4524;
    --x: #c4161c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--sea);
    color: var(--ink);
    font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  main { width: min(96vw, 1100px); }
  h1 {
    margin: 0 0 10px;
    text-align: center;
    color: #f3e4b8;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    letter-spacing: .04em;
  }
  .frame {
    border: 8px solid var(--wall);
    border-radius: 10px;
    background: var(--paper);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }
  .label { font-family: inherit; font-size: 34px; fill: var(--ink); text-anchor: middle; }
  .small { font-size: 28px; }
  .x-mark { animation: pulse 1.6s ease-in-out infinite; transform-origin: 903px 609px; transform-box: view-box; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { .x-mark { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Find the last gift</h1>
  <div class="frame">
    <svg viewBox="200 230 1760 880" role="img" aria-label="Skattekort med borde, vægge, biler og et rødt kryds">
      <defs>
        <filter id="paper" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".02 .03" numOctaves="3" seed="4"/>
          <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .1  0 0 0 .25 0"/>
        </filter>

        <g id="car">
          <rect x="0" y="0" width="360" height="100" rx="34" fill="#4d6f8a" stroke="#2b3f50" stroke-width="5"/>
          <rect x="95" y="10" width="170" height="80" rx="16" fill="#9ec3d9" stroke="#2b3f50" stroke-width="4"/>
          <rect x="35" y="-8" width="55" height="14" rx="5" fill="#222"/>
          <rect x="270" y="-8" width="55" height="14" rx="5" fill="#222"/>
          <rect x="35" y="94" width="55" height="14" rx="5" fill="#222"/>
          <rect x="270" y="94" width="55" height="14" rx="5" fill="#222"/>
        </g>

        <g id="table">
          <rect width="1" height="1" fill="none"/>
        </g>
      </defs>

      <!-- papir -->
      <rect x="200" y="230" width="1760" height="880" fill="var(--paper)"/>
      <rect x="200" y="230" width="1760" height="880" filter="url(#paper)"/>

      <!-- vej -->
      <path d="M985,500 C990,330 1060,250 1230,247 C1400,262 1700,285 1930,257 L1925,347 L1280,358 C1160,365 1130,440 1105,515 Z"
            fill="#8f8a80" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M1040,470 C1060,350 1120,310 1250,300 C1450,315 1700,320 1900,302"
            fill="none" stroke="#e8e2cf" stroke-width="6" stroke-dasharray="26 22"/>
      <text class="label" x="1520" y="280" transform="rotate(-1 1520 280)">Vej</text>

      <!-- gård / terrasse -->
      <polygon points="275,520 1170,515 1182,1042 205,1073" fill="#d7c58f" stroke="none"/>
      <!-- parkering -->
      <polygon points="1170,515 1832,533 1818,1058 1172,1050" fill="#c7b98d"/>

      <!-- vægge -->
      <g fill="none" stroke="var(--wall)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M243,502 L1170,515 L1832,533 L1818,1058 L1172,1050 L1182,1042 L205,1073 L275,520"/>
        <path d="M1166,520 L1182,1042"/>
      </g>

      <!-- indgang -->
      <path d="M985,515 V570 H1030 Q1070,565 1070,518" fill="#e8d9ab" stroke="var(--wall)" stroke-width="8" stroke-linejoin="round"/>
      <text class="label small" x="1028" y="598">Indgang</text>

      <!-- lille niche ved væggen -->
      <path d="M1113,685 V645 Q1115,610 1163,600 V685 Z" fill="#a59a7a" stroke="var(--wall)" stroke-width="6" stroke-linejoin="round"/>

      <!-- borde -->
      <g fill="var(--wood)" stroke="var(--wall)" stroke-width="6" stroke-linejoin="round">
        <path d="M518,603 L814,591 V680 L506,688 Q518,660 518,603 Z"/>
        <path d="M487,760 L793,771 L788,829 L476,814 Z"/>
        <path d="M851,590 H950 V638 H840 Z" fill="#c99a5c"/>
      </g>
      <text class="label" x="660" y="660">table</text>
      <text class="label" x="640" y="806">Wall</text>

      <!-- bænk (L-form) -->
      <path d="M502,932 L545,935 V1008 L758,1005 L752,1068 L502,1066 Z" fill="#7d8f5a" stroke="var(--wall)" stroke-width="6" stroke-linejoin="round"/>
      <text class="label small" x="640" y="1050">sofa</text>

      <!-- busk og træ -->
      <ellipse cx="625" cy="955" rx="21" ry="26" fill="#6fa14b" stroke="#2f5a22" stroke-width="5"/>
      <circle cx="925" cy="987" r="58" fill="#5d9a3c" stroke="#2f5a22" stroke-width="6"/>
      <circle cx="905" cy="970" r="18" fill="#76b250" opacity=".7"/>
      <circle cx="945" cy="1005" r="15" fill="#4a8030" opacity=".7"/>
      <text class="label" x="925" y="1115" style="display:none">christmas tree</text>
      <text class="label small" x="925" y="1068" fill="#fff">christmas tree</text>

      <!-- biler -->
      <use href="#car" x="1268" y="598"/>
      <use href="#car" x="1275" y="820"/>
      <text class="label small" x="1450" y="745">Bil</text>
      <text class="label small" x="1458" y="985">Bil</text>

      <!-- rute -->
      <path d="M1030,560 C1062,700 1050,850 995,935 C915,880 935,770 940,700 C940,670 925,640 915,622"
            fill="none" stroke="var(--ink)" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/>

      <!-- start -->
      <g transform="translate(1040,430)">
        <circle r="26" fill="var(--wall)"/>
        <text class="label small" y="10" fill="#fff" style="fill:#fff">S</text>
      </g>
      <text class="label small" x="1040" y="395">Start</text>

      <!-- krydset -->
      <g class="x-mark" stroke="var(--x)" stroke-width="12" stroke-linecap="round">
        <path d="M880,587 L926,631"/>
        <path d="M926,587 L880,631"/>
      </g>
      <text class="label small" x="900" y="568" style="fill:var(--x)">Gaven!</text>

      <!-- kompas -->
      <g transform="translate(360,340)">
        <circle r="70" fill="none" stroke="var(--ink)" stroke-width="4"/>
        <path d="M0,-92 L14,0 L0,92 L-14,0 Z" fill="var(--ink)" opacity=".85"/>
        <path d="M-92,0 L0,-14 L92,0 L0,14 Z" fill="var(--wood)" stroke="var(--ink)" stroke-width="3"/>
        <text class="label small" x="0" y="-104">N</text>
      </g>
    </svg>
  </div>
</main>
</body>
</html>
